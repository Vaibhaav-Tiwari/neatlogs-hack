# Live-read demo config:
#   npm run tally -- demo --live
#
# Workers, usage and test verdicts are still simulated from sample-backlog.yaml.
# Read-only integrations are live so the dashboard can show them as connected.
version: 1

repo:
  path: .
  slug: demo/invoice-ledger
  baseBranch: main

test:
  command: npm test

backlog:
  source: file
  file: sample-backlog.yaml

tiers:
  - name: cheap
    harness: claude-code
    provider: litellm
    model: nova-micro
    price: { inputUsdPerMTok: 0.035, cachedInputUsdPerMTok: 0.00875, outputUsdPerMTok: 0.14 }
    ceilingFraction: 0.2
  - name: middle
    harness: claude-code
    provider: litellm
    model: claude-sonnet-4.6
    price: { inputUsdPerMTok: 3.3, cachedInputUsdPerMTok: 0.33, outputUsdPerMTok: 16.5 }
    ceilingFraction: 0.5
  - name: top
    harness: claude-code
    provider: litellm
    model: claude-opus-4.6
    price: { inputUsdPerMTok: 5.5, cachedInputUsdPerMTok: 0.55, outputUsdPerMTok: 27.5 }
    ceilingFraction: 1

ceilings:
  bySizeUsd: { small: 1, medium: 4, large: 10 }

budget:
  source: cfoai
  usd: 40
  cfoai:
    orgId: "103210"
    scenario: Main Scenario
    table: Tally agent budget
    budgetRow: Agent budget
    spendRow: Agent spend
    remainingRow: Budget remaining
    tableUrl: https://app.cfo.ai/s/p_AQKqpgYkMDBiYzMwNzQtZjA3OS00YjYwLWFlYTctM2FjYzYyMjgxMDQ5DWRlZmF1bHRfbGF5ZXI

concurrency: 3

integrations:
  neatlogs: true
  entire: true
  cfoai: true
  slack: false
