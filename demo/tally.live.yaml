# Live-read demo config:
#   npm run tally -- demo --live
#
# Workers, usage and test verdicts are still simulated from sample-backlog.yaml.
# Read-only integrations are live so the dashboard can show them as connected.
version: 1

repo:
  path: .
  slug: demo/invoice-ledger
  baseBranch: main

test:
  command: npm test

backlog:
  source: file
  file: sample-backlog.yaml

tiers:
  - name: cheap
    harness: claude-code
    provider: litellm
    model: nova-micro
    price: { inputUsdPerMTok: 0.035, cachedInputUsdPerMTok: 0.00875, outputUsdPerMTok: 0.14 }
    ceilingFraction: 0.2
  - name: middle
    harness: claude-code
    provider: litellm
    model: claude-sonnet-4.6
    price: { inputUsdPerMTok: 3.3, cachedInputUsdPerMTok: 0.33, outputUsdPerMTok: 16.5 }
    ceilingFraction: 0.5
  - name: top
    harness: claude-code
    provider: litellm
    model: claude-opus-4.6
    price: { inputUsdPerMTok: 5.5, cachedInputUsdPerMTok: 0.55, outputUsdPerMTok: 27.5 }
    ceilingFraction: 1

ceilings:
  bySizeUsd: { small: 1, medium: 4, large: 10 }

budget:
  source: cfoai
  usd: 40
  # Fill these placeholder fields from your cfo.ai workspace before using
  # `tally demo --live`; then run `tally login cfoai` once on this machine.
  cfoai:
    orgId: "<cfoai-org-id>"
    scenario: "<scenario-name>"
    table: "<budget-table-name>"
    budgetRow: "<budget-row-name>"
    spendRow: "<spend-row-name>"
    remainingRow: "<remaining-row-name>"
    tableUrl: "https://app.cfo.ai/s/example-budget-table"
    spendDetailTable: "<spend-detail-table-name>"
    spendDetailTableUrl: "https://app.cfo.ai/s/example-spend-detail-table"
    tierSpendRows:
      cheap: "<cheap-tier-spend-row>"
      middle: "<middle-tier-spend-row>"
      top: "<top-tier-spend-row>"
    runSpendRow: "<current-run-spend-row>"
    cumulativeRunSpendRow: "<cumulative-run-spend-row>"

concurrency: 3

integrations:
  neatlogs: true
  entire: true
  cfoai: true
  slack: false
